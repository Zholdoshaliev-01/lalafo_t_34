<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Категории</title>
    <style>
        :root {
            --bg: #f5f6fa;
            --card: #ffffff;
            --text: #1f2430;
            --muted: #7a8194;
            --accent: #6c5ce7;
            --shadow: 0 4px 14px rgba(20, 20, 50, .08);
            --shadow-hover: 0 14px 30px rgba(108, 92, 231, .25);
        }
        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #12141c;
                --card: #1c1f2b;
                --text: #eceef5;
                --muted: #9aa1b5;
                --shadow: 0 4px 14px rgba(0, 0, 0, .4);
            }
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 48px 20px;
        }
        .page-title {
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 8px;
        }
        .page-subtitle {
            color: var(--muted);
            margin-bottom: 36px;
        }
        .grid {
            list-style: none;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 24px;
        }
        .card {
            position: relative;
            display: block;
            background: var(--card);
            border-radius: 18px;
            overflow: hidden;
            text-decoration: none;
            color: inherit;
            box-shadow: var(--shadow);
            transition: transform .25s ease, box-shadow .25s ease;
        }
        .card:hover {
            transform: translateY(-6px);
            box-shadow: var(--shadow-hover);
        }
        .card-img {
            aspect-ratio: 4 / 3;
            overflow: hidden;
            background: linear-gradient(135deg, #6c5ce7, #a29bfe);
        }
        .card-img img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            transition: transform .4s ease;
        }
        .card:hover .card-img img { transform: scale(1.08); }
        .card-placeholder {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3rem;
            font-weight: 700;
            color: rgba(255, 255, 255, .85);
        }
        .card-body {
            padding: 16px 18px 18px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
        }
        .card-title {
            font-size: 1.05rem;
            font-weight: 600;
        }
        .card-arrow {
            color: var(--accent);
            font-size: 1.3rem;
            transition: transform .25s ease;
        }
        .card:hover .card-arrow { transform: translateX(5px); }
        .empty {
            text-align: center;
            color: var(--muted);
            padding: 80px 0;
            grid-column: 1 / -1;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1 class="page-title">Категории</h1>
        <p class="page-subtitle">Выберите интересующую вас категорию</p>

        <ul class="grid">
            {% for i in categories %}
            <li>
                <a href="#" class="card">
                    <div class="card-img">
                        {% if i.category_image %}
                            <img src="{{ i.category_image.url }}" alt="{{ i.category_name }}" loading="lazy">
                        {% else %}
                            <div class="card-placeholder">{{ i.category_name|first|upper }}</div>
                        {% endif %}
                    </div>
                    <div class="card-body">
                        <span class="card-title">{{ i.category_name }}</span>
                        <span class="card-arrow">→</span>
                    </div>
                </a>
            </li>
            {% empty %}
            <li class="empty">Пока нет ни одной категории</li>
            {% endfor %}
        </ul>
    </div>
</body>
</html>
