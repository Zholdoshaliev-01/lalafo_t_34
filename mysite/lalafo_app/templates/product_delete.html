<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Удалить: {{ object.product_name }}</title>
    <style>
        :root {
            --bg: #f5f6fa;
            --card: #ffffff;
            --text: #1f2430;
            --muted: #7a8194;
            --accent: #6c5ce7;
            --accent-soft: rgba(108, 92, 231, .12);
            --danger: #e0434f;
            --danger-soft: rgba(224, 67, 79, .12);
            --border: #e8eaf2;
            --shadow: 0 4px 14px rgba(20, 20, 50, .08);
        }
        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #12141c;
                --card: #1c1f2b;
                --text: #eceef5;
                --muted: #9aa1b5;
                --border: #2a2e3d;
                --shadow: 0 4px 14px rgba(0, 0, 0, .4);
            }
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .box {
            width: 100%;
            max-width: 460px;
            background: var(--card);
            border-radius: 22px;
            padding: 36px 32px 32px;
            box-shadow: var(--shadow);
            text-align: center;
        }
        .icon {
            width: 72px; height: 72px;
            margin: 0 auto 20px;
            border-radius: 50%;
            background: var(--danger-soft);
            display: flex; align-items: center; justify-content: center;
            font-size: 2rem;
        }
        h1 { font-size: 1.5rem; margin-bottom: 8px; }
        .text { color: var(--muted); line-height: 1.5; margin-bottom: 22px; }

        .product-mini {
            display: flex;
            align-items: center;
            gap: 14px;
            text-align: left;
            padding: 12px;
            border: 1px solid var(--border);
            border-radius: 14px;
            margin-bottom: 26px;
        }
        .product-mini .thumb {
            width: 56px; height: 56px;
            flex-shrink: 0;
            border-radius: 10px;
            overflow: hidden;
            background: linear-gradient(135deg, #6c5ce7, #a29bfe);
            color: #fff;
            display: flex; align-items: center; justify-content: center;
            font-weight: 700; font-size: 1.3rem;
        }
        .product-mini .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
        .product-mini .name { font-weight: 600; }
        .product-mini .price { color: var(--accent); font-weight: 700; font-size: .95rem; }

        .actions { display: flex; gap: 12px; }
        .btn {
            flex: 1;
            text-align: center;
            text-decoration: none;
            font: inherit;
            font-weight: 600;
            padding: 14px 20px;
            border-radius: 14px;
            border: none;
            cursor: pointer;
            transition: transform .2s ease, box-shadow .2s ease, background .2s ease;
        }
        .btn-danger { background: var(--danger); color: #fff; }
        .btn-danger:hover { transform: translateY(-2px); box-shadow: 0 10px 22px rgba(224, 67, 79, .35); }
        .btn-ghost { background: var(--accent-soft); color: var(--accent); }
        .btn-ghost:hover { background: var(--accent); color: #fff; }
    </style>
</head>
<body>
    <div class="box">
        <div class="icon">🗑️</div>
        <h1>Удалить товар?</h1>
        <p class="text">Это действие нельзя отменить. Товар будет удалён навсегда.</p>

        <div class="product-mini">
            <div class="thumb">
                {% if object.product_image %}
                    <img src="{{ object.product_image.url }}" alt="{{ object.product_name }}">
                {% else %}
                    {{ object.product_name|first|upper }}
                {% endif %}
            </div>
            <div>
                <div class="name">{{ object.product_name }}</div>
                <div class="price">{{ object.price }} сом</div>
            </div>
        </div>

        <form method="post">
            {% csrf_token %}
            <div class="actions">
                <a href="{% url 'product_detail' object.pk %}" class="btn btn-ghost">Отмена</a>
                <button type="submit" class="btn btn-danger">Да, удалить</button>
            </div>
        </form>
    </div>
</body>
</html>
